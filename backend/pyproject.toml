[project]
name = "agent-backend"
version = "0.1.0"
description = "FastAPI backend with LangChain and LangGraph for AI agents"
readme = "README.md"
authors = [
    { name = "Kilo Agent", email = "agent@kilo.local" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi",
    "httpx",
    "langchain[mcp]==1.4.9",
    "langchain-docling[local]>=3.0",
    "langchain-openai",
    "langgraph",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn[standard]",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-google-genai>=4.4.3",
]

[project.scripts]
agent-backend = "agent_backend.main:app"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
